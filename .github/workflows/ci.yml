name: MD5 Crack Workflow
on:
  push:
    branches: [ main ]  # 推送代码到main分支时触发
  workflow_dispatch:    # 允许手动触发

jobs:
  crack:
    runs-on: ubuntu-latest  # 使用Ubuntu环境
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 拉取代码

      - name: Set up Rust
        uses: actions-rs/toolchain@v1  # 安装Rust
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build and run
        run: |
          cargo build --release  # 编译程序
          cargo run --release    # 运行程序
