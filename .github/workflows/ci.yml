name: MD5 Crack (Manual Trigger)

on:
  workflow_dispatch:  # 仅保留手动触发

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
  # You may pin to the exact commit or the version.
  # uses: jetsung/setup-zig@ece60a5f01428e90311476245667dc49e3f84513
        uses: jetsung/setup-zig@v0.0.4
        with:
    # Zig version (e.g. 0.15.2, dev, master). Leave empty for latest stable.
          version: dev # optional, default is 
          

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install Zig crypto package
        run: zig init && zig fetch --save git+https://github.com/ziglang/crypto.git#main
      - name: Build program
        run: zig build-exe main.zig -O ReleaseFast -target x86_64-linux -static -lc -lcrypto
      - name: Run program
        run: ./main
