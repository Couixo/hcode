buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://maven.pkg.jetbrains.space/kotlin/p/kotlin/bootstrap" }
    }    
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.10'
        val composeBom = platform("androidx.compose:compose-bom:2026.03.00")
        implementation composeBom
        implementation "androidx.compose.ui:ui" // 自动包含text.input子包
    }
}
plugins {
        id "org.jetbrains.kotlin.plugin.compose" version "2.3.20"
}
// 项目仓库配置（给 App 依赖用）
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
// 1. 仓库配置（必须放在 buildscript 外部）
allprojects {
    repositories {
        google() // Google Maven 仓库
        mavenCentral() // Maven 中央仓库
    }
}
// 2. 构建脚本配置（插件依赖）
apply plugin: 'com.android.application'
// 3. Android模块配置（编译规则）
android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "org.somebody.hcode"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        namespace "org.somebody.hcode" // 替换为你的包名
        }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.10.5"
    }
    sourceSets {
        main {
            jniLibs.srcDirs "libs"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation platform("androidx.compose:compose-bom:2026.03.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.runtime:runtime-android"
    implementation "androidx.compose.ui:ui-text"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.20"
    implementation "androidx.activity:activity-compose:1.13.0"
}
